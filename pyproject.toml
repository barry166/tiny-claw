[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tiny-claw"
version = "0.1.0"
description = "A tiny readable agent harness for Python CLI agents."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Tiny Claw Authors" }]
license = "MIT"
keywords = [
    "agent",
    "agent-harness",
    "ai-agent",
    "cli",
    "developer-tools",
    "llm",
    "python",
    "react-agent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "anthropic>=0.104,<1",
    "lark-oapi[aiohttp]>=1.6.8,<2",
    "openai>=2.38,<3",
]

[project.scripts]
tiny-claw = "tiny_claw.cli:main"

[project.urls]
Homepage = "https://github.com/barry166/tiny-claw"
Repository = "https://github.com/barry166/tiny-claw"
Issues = "https://github.com/barry166/tiny-claw/issues"
Documentation = "https://github.com/barry166/tiny-claw/tree/codex/session-plan-mode-cli/docs"

[dependency-groups]
dev = [
    "mypy>=1.16",
    "pytest>=8.4",
    "ruff>=0.11",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
mypy_path = "src"
packages = ["tiny_claw"]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
