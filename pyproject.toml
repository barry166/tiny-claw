[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tiny-claw"
version = "0.1.0"
description = "An industrial Python CLI framework skeleton."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Tiny Claw Authors" }]
license = "MIT"
dependencies = [
    "anthropic>=0.104,<1",
    "lark-oapi[aiohttp]>=1.6.8,<2",
    "openai>=2.38,<3",
]

[project.scripts]
tiny-claw = "tiny_claw.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.16",
    "pytest>=8.4",
    "ruff>=0.11",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
mypy_path = "src"
packages = ["tiny_claw"]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
